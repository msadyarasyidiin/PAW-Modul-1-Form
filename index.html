<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Form Registrasi</title>
    <style>
        body {
            font-family: "Times New Roman", serif;
            font-size: 13px;
            margin: 8px;
        }

        h2 {
            font-size: 18px;
            margin: 0 0 14px 0;
        }

        fieldset {
            margin-bottom: 12px;
            padding: 7px 10px 9px 10px;
        }

        legend {
            padding: 0 2px;
        }

        .form-row {
            display: flex;
            align-items: center;
            margin: 3px 0;
        }

        .label {
            width: 125px;
        }

        .colon {
            width: 8px;
        }

        input[type="text"],
        input[type="password"],
        input[type="email"],
        input[type="url"] {
            height: 15px;
            padding: 1px 3px;
            border: 1px solid #aaa;
            font-family: Arial, sans-serif;
            font-size: 11px;
        }

        .nama { width: 90px; }
        .nim { width: 125px; }
        .alamat { width: 165px; height: 50px; resize: none; }
        .url { width: 175px; }
        .email, .username, .password { width: 90px; }

        select {
            font-size: 12px;
            height: 21px;
        }

        input[type="file"] {
            font-size: 12px;
        }

        .kemampuan label {
            margin-right: 5px;
        }

        button {
            font-family: "Times New Roman", serif;
            font-size: 11px;
            padding: 1px 6px;
            margin-right: 4px;
        }
    </style>
</head>
<body>

    <h2>Form Registrasi</h2>

    <form>
        <fieldset>
            <legend>Biodata</legend>

            <div class="form-row">
                <span class="label">Nama Mahasiswa</span>
                <span class="colon">:</span>
                <input type="text" class="nama" placeholder="Nama Anda">
            </div>

            <div class="form-row">
                <span class="label">No Induk Mahasiswa (NIM)</span>
                <span class="colon">:</span>
                <input type="text" class="nim" value="123456789">
            </div>

            <div class="form-row" style="align-items:flex-start;">
                <span class="label">Alamat Mahasiswa</span>
                <span class="colon">:</span>
                <textarea class="alamat" placeholder="Alamat Anda"></textarea>
            </div>

            <div class="form-row">
                <span class="label">Tanggal Lahir</span>
                <span class="colon">:</span>
                <select>
                    <option>01</option>
                    <option>02</option>
                    <option>03</option>
                </select>
                <select>
                    <option>Januari</option>
                    <option>Februari</option>
                    <option>Maret</option>
                </select>
                <select>
                    <option>1990</option>
                    <option>1991</option>
                    <option>1992</option>
                </select>
            </div>

            <div class="form-row">
                <span class="label">Jenis Kelamin</span>
                <span class="colon">:</span>
                <label><input type="radio" name="gender" checked>Pria</label>
                <label><input type="radio" name="gender">Wanita</label>
            </div>

            <div class="form-row">
                <span class="label">Upload Foto</span>
                <span class="colon">:</span>
                <input type="file">
            </div>

            <div class="form-row">
                <span class="label">URL Website</span>
                <span class="colon">:</span>
                <input type="url" class="url" placeholder="URL Website Anda">
            </div>

            <div class="form-row">
                <span class="label">Perguruan Tinggi</span>
                <span class="colon">:</span>
                <input type="text" class="nama">
            </div>
        </fieldset>

        <fieldset>
            <legend>Info Akun</legend>

            <div class="form-row">
                <span class="label">Email</span>
                <span class="colon">:</span>
                <input type="email" class="email" placeholder="Email Anda">
            </div>

            <div class="form-row">
                <span class="label">Username</span>
                <span class="colon">:</span>
                <input type="text" class="username" placeholder="Username Anda">
            </div>

            <div class="form-row">
                <span class="label">Password</span>
                <span class="colon">:</span>
                <input type="password" class="password" placeholder="Password Anda">
            </div>

            <div class="form-row">
                <span class="label">Ulangi Password</span>
                <span class="colon">:</span>
                <input type="password" class="password" placeholder="Password Anda">
            </div>
        </fieldset>

        <fieldset class="kemampuan">
            <legend>Kemampuan Dasar</legend>
            <label><input type="checkbox">HTML</label>
            <label><input type="checkbox">CSS</label>
            <label><input type="checkbox">Javascript</label>
            <label><input type="checkbox">PHP</label>
            <label><input type="checkbox">MySQL</label>
            <label><input type="checkbox">Laravel</label>
            <label><input type="checkbox">React Native</label>
        </fieldset>

        <button type="reset">Reset</button>
        <button type="submit">Simpan</button>
        <button type="button">Button</button>
    </form>

</body>
</html>
